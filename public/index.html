<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Chart</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
  </head>

  <style>
    body {
      margin: 0;
      font-family: "Roboto", sans-serif;
    }
    .live-view {
      height: 100vh;
      background-color: #171717;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .avatar-user {
      height: 50%;
      aspect-ratio: 1;
      border-radius: 50%;
      /* overflow: hidden; */
      position: relative;
    }
    .avatar-user img {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      z-index: 10;
      top: 0;
    }
    .name-user {
      margin-top: 50px;
      font-size: 70px;
      color: white;
    }
    .typewriter h1 {
      overflow: hidden; /* Ensures the content is not revealed until the animation */
      white-space: nowrap; /* Keeps the content on a single line */
      margin: 0 auto; /* Gives that scrolling effect as the typing happens */
      letter-spacing: 0.15em; /* Adjust as needed */
      animation: typing 2s steps(40, end);
    }

    /* The typing effect */
    @keyframes typing {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }

    .shadow {
      width: 100%;
      height: 100%;
      background: linear-gradient(315deg, #03a9f4, #ff0058);
      z-index: -1;
      filter: blur(25px);
    }
    .card .shadow {
      animation: rotate 3s linear infinite;
    }
    @keyframes rotate {
      0% {
        rotate: 0deg;
        background: linear-gradient(315deg, #03a9f4, #ff0058);
      }

      50% {
        rotate: 180deg;
        background: linear-gradient(45deg, #ffbc00, #ff0058);
      }

      100% {
        rotate: 360deg;
        background: linear-gradient(315deg, #4dff03, #00d0ff);
      }
    }
  </style>

  <body>
    <div class="body">
      <div class="main">
        <!-- <div class="control-view">
                <input id="myInput" placeholder="Input tiktok id" />
                <button onclick="submitData()">Connect</button>
                <button onclick="disconnectTitktok()">Disconnect</button>
            </div> -->
        <div class="live-view">
          <div class="avatar-user card">
            <div class="shadow"></div>
            <img
              src="https://as2.ftcdn.net/v2/jpg/04/10/43/77/1000_F_410437733_hdq4Q3QOH9uwh0mcqAhRFzOKfrCR24Ta.jpg"
            />
          </div>
          <div class="name-user typewriter content"><h1>Duong Ca Ca</h1></div>
        </div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      var arrayPlotter = document.getElementById("arrayPlotter");
      const modelPlots = [
        {
          name: "---",
          avatar: "",
          userId: 0,
        },
      ];
      const maxPlotter = 15;
      let plotter = [];
      let index_replace = 0;

      socket.on("member", (data) => {
        if (data) {
          if (plotter.length >= maxPlotter) {
            if (index_replace >= maxPlotter) {
              index_replace = 0;
            }
            plotter.splice(index_replace, 1, data);
            index_replace++;
          } else {
            plotter.push(data);
          }

          const validatePlotter = plotter.map((viewer) => {
            return {
              name: viewer.nickname || "---",
              avatar: viewer.profilePictureUrl || "",
              userId: viewer.userId || 0,
            };
          });
          const viewerList = data.topViewers || [];
          let innerHTML = "";
          validatePlotter.map((viewer) => {
            innerHTML += `
                    <div id="position" class="sunflower">
                        <div class="head">
                            <div><img class="viewer-avatar"
                                    src="${viewer.avatar}" />
                            </div>
                        </div>
                        <div class="petals"></div>
                        <div class="trunk">
                            <div class="left-branch"></div>
                            <div class="right-branch"></div>
                        </div>
                        <div class="vase">
                            <div class="viewer-name">${viewer.name}</div>
                        </div>
                    </div>
                    `;
          });
          arrayPlotter.innerHTML = innerHTML;
        }
      });

      const submitData = () => {
        // Retrieve the input value
        var inputData = document.getElementById("myInput").value;

        fetch("/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ inputData: inputData }),
        })
          .then((response) => response.json())
          .then((data) => console.log(data))
          .catch((error) => console.log(error));
      };

      const disconnectTitktok = () => {
        fetch("/stop", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
        })
          .then((response) => response.json())
          .then((data) => console.log(data))
          .catch((error) => console.log(error));
      };
    </script>
  </body>
</html>
