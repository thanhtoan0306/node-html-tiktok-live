<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Chart</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div class="body">
      <div class="main">
        <div class="control-view">
          <input
            style="width: 10px"
            id="myInput"
            placeholder="Input tiktok id"
          />
          <button onclick="submitData()">C</button>
          <button onclick="disconnectTitktok()">D</button>
        </div>
        <div class="live-view" id="live-view">
          <div class="top-3">
            <div class="top1 unit-uni">
              <div>
                <div class="avatar-uni">
                  <img
                    width="auto"
                    height="180px"
                    class="img-uni"
                    src="https://upload.wikimedia.org/wikipedia/commons/b/b9/Logo_Tr%C6%B0%E1%BB%9Dng_%C4%90%E1%BA%A1i_H%E1%BB%8Dc_S%C6%B0_Ph%E1%BA%A1m_K%E1%BB%B9_Thu%E1%BA%ADt_TP_H%E1%BB%93_Ch%C3%AD_Minh.png"
                  />
                </div>
              </div>
              <div class="code-uni">332</div>
              <div style="height: 200px" class="column-rank">
                <div class="e-card playing">
                  <div class="wave"></div>
                  <div class="wave"></div>
                  <div class="wave"></div>
                </div>
              </div>
              <div class="code-uni">Top 1 - UTE</div>
            </div>
            <div class="top2 unit-uni">
              <div>
                <div class="avatar-uni">
                  <img
                    width="auto"
                    height="180px"
                    class="img-uni"
                    src="https://upload.wikimedia.org/wikipedia/commons/b/b9/Logo_Tr%C6%B0%E1%BB%9Dng_%C4%90%E1%BA%A1i_H%E1%BB%8Dc_S%C6%B0_Ph%E1%BA%A1m_K%E1%BB%B9_Thu%E1%BA%ADt_TP_H%E1%BB%93_Ch%C3%AD_Minh.png"
                  />
                </div>
              </div>
              <div class="code-uni">332</div>
              <div style="height: 400px" class="column-rank"></div>
              <div class="code-uni">Top 1 - UTE</div>
            </div>
            <div class="top2 unit-uni">
              <div>
                <div class="avatar-uni">
                  <img
                    width="auto"
                    height="180px"
                    class="img-uni"
                    src="https://upload.wikimedia.org/wikipedia/commons/b/b9/Logo_Tr%C6%B0%E1%BB%9Dng_%C4%90%E1%BA%A1i_H%E1%BB%8Dc_S%C6%B0_Ph%E1%BA%A1m_K%E1%BB%B9_Thu%E1%BA%ADt_TP_H%E1%BB%93_Ch%C3%AD_Minh.png"
                  />
                </div>
              </div>
              <div class="code-uni">332</div>
              <div style="height: 400px" class="column-rank"></div>
              <div class="code-uni">Top 1 - UTE</div>
            </div>
            <div class="top5below">
              <!-- <div>Top5: UIT - 56 votes</div>
              <div>Top5: UIT - 56 votes</div> -->
              <div class="card">
                <div class="user__container">
                  <div class="user">
                    <div class="image">
                      <img
                        src="https://upload.wikimedia.org/wikipedia/commons/b/b9/Logo_Tr%C6%B0%E1%BB%9Dng_%C4%90%E1%BA%A1i_H%E1%BB%8Dc_S%C6%B0_Ph%E1%BA%A1m_K%E1%BB%B9_Thu%E1%BA%ADt_TP_H%E1%BB%93_Ch%C3%AD_Minh.png"
                      />
                    </div>
                    <div class="user__content">
                      <div class="text">
                        <div>UTE: 20 votes</div>
                      </div>
                      <button class="follow">Top 3</button>
                    </div>
                  </div>
                  <div class="user">
                    <div class="image">
                      <img
                        src="https://upload.wikimedia.org/wikipedia/commons/b/b9/Logo_Tr%C6%B0%E1%BB%9Dng_%C4%90%E1%BA%A1i_H%E1%BB%8Dc_S%C6%B0_Ph%E1%BA%A1m_K%E1%BB%B9_Thu%E1%BA%ADt_TP_H%E1%BB%93_Ch%C3%AD_Minh.png"
                      />
                    </div>
                    <div class="user__content">
                      <div class="text">
                        <div>UTE: 20 votes</div>
                      </div>
                      <button class="follow">Top 3</button>
                    </div>
                  </div>
                  <div class="user">
                    <div class="image">
                      <img
                        src="https://upload.wikimedia.org/wikipedia/commons/b/b9/Logo_Tr%C6%B0%E1%BB%9Dng_%C4%90%E1%BA%A1i_H%E1%BB%8Dc_S%C6%B0_Ph%E1%BA%A1m_K%E1%BB%B9_Thu%E1%BA%ADt_TP_H%E1%BB%93_Ch%C3%AD_Minh.png"
                      />
                    </div>
                    <div class="user__content">
                      <div class="text">
                        <div>UTE: 20 votes</div>
                      </div>
                      <button class="follow">Top 3</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="top5below">
              <!-- <div>Top5: UIT - 56 votes</div>
              <div>Top5: UIT - 56 votes</div> -->
              <div class="card">
                <div class="user__container">
                  <div class="user">
                    <div class="image"></div>
                    <div class="user__content">
                      <div class="text">
                        <span class="name">Name</span>
                        <p class="username">@namedlorem</p>
                      </div>
                      <button class="follow">Follow</button>
                    </div>
                  </div>
                  <div class="user">
                    <div class="image"></div>
                    <div class="user__content">
                      <div class="text">
                        <span class="name">Name</span>
                        <p class="username">@namedlorem</p>
                      </div>
                      <button class="follow">Follow</button>
                    </div>
                  </div>
                  <div class="user">
                    <div class="image"></div>
                    <div class="user__content">
                      <div class="text">
                        <span class="name">Name</span>
                        <p class="username">@namedlorem</p>
                      </div>
                      <button class="follow">Follow</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="index.js"></script>
  </body>
</html>
