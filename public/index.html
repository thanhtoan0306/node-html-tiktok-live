<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chart</title>
</head>



<body>
    <div class="body">
        <div class="main">
            <div class="live-view">
                <div id="arrayPlotter">
                    <div id="position" class="sunflower">
                        <div class="head">
                            <div><img class="viewer-avatar"
                                    src="https://www.richardtmoore.co.uk/wp-content/uploads/2016/10/btx-avatar-placeholder-01-2.jpg" />
                            </div>
                        </div>
                        <div class="petals"></div>
                        <div class="trunk">
                            <div class="left-branch"></div>
                            <div class="right-branch"></div>
                        </div>
                        <div class="vase">
                            <div class="viewer-name">${viewer.name}</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="control-view">
                <input id="myInput" placeholder="Input tiktok id" />
                <button onclick="submitData()">Connect</button>
                <button onclick="disconnectTitktok()">Disconnect</button>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        var arrayPlotter = document.getElementById("arrayPlotter");
        const modelPlots = [
            {
                name: '---',
                avatar: '',
                userId: 0,
            },

        ]
        const maxPlotter = 15
        let plotter = [];
        let index_replace = 0

        socket.on('member', (data) => {
            if (data) {
                if (plotter.length >= maxPlotter) {
                    if (index_replace >= maxPlotter) {
                        index_replace = 0;
                    }
                    plotter.splice(index_replace, 1, data);
                    index_replace++;
                } else {
                    plotter.push(data);
                }

                const validatePlotter = plotter.map(viewer => {
                    return (
                        {
                            name: viewer.nickname || '---',
                            avatar: viewer.profilePictureUrl || '',
                            userId: viewer.userId || 0,
                        }
                    )
                })
                const viewerList = data.topViewers || [];
                let innerHTML = ""
                validatePlotter.map(viewer => {
                    innerHTML += `
                    <div id="position" class="sunflower">
                        <div class="head">
                            <div><img class="viewer-avatar"
                                    src="${viewer.avatar}" />
                            </div>
                        </div>
                        <div class="petals"></div>
                        <div class="trunk">
                            <div class="left-branch"></div>
                            <div class="right-branch"></div>
                        </div>
                        <div class="vase">
                            <div class="viewer-name">${viewer.name}</div>
                        </div>
                    </div>
                    `
                })
                arrayPlotter.innerHTML = innerHTML;
            }

        });

        const submitData = () => {
            // Retrieve the input value
            var inputData = document.getElementById("myInput").value;

            fetch('/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ inputData: inputData })
            })
                .then(response => response.json())
                .then(data => console.log(data))
                .catch(error => console.log(error));
        }

        const disconnectTitktok = () => {

            fetch('/stop', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
            })
                .then(response => response.json())
                .then(data => console.log(data))
                .catch(error => console.log(error));
        } 
    </script>
</body>

</html>
